name: "クロール実行の後始末"
description: "未完了のまま残ったクロール対象を失敗として記録する"

inputs:
  api-base-url:
    description: "クローラーAPIのベースURL"
    required: true
  api-key:
    description: "クローラーAPIのキー"
    required: true
  crawl-run-id:
    description: "クロール実行ID"
    required: true

runs:
  using: composite
  steps:
    - name: 未完了のクロール対象を失敗として記録
      shell: bash
      env:
        API_BASE_URL: ${{ inputs.api-base-url }}
        API_KEY: ${{ inputs.api-key }}
        CRAWL_RUN_ID: ${{ inputs.crawl-run-id }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        body="$(
          jq --null-input --arg url "${RUN_URL}" \
            '{error: ("ワークフローが結果を送信せずに終了しました: " + $url)}'
        )"
        curl \
          --fail-with-body \
          --silent \
          --show-error \
          --request POST \
          --header "Authorization: Bearer ${API_KEY}" \
          --header "Content-Type: application/json" \
          --data "${body}" \
          "${API_BASE_URL}/api/crawler/runs/${CRAWL_RUN_ID}/failure"
