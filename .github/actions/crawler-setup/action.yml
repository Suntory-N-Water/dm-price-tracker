name: "クローラー環境のセットアップ"
description: "Node.js、依存パッケージ、Chromiumをセットアップする"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        version: 10

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ".node-version"
        cache: "pnpm"

    - name: 依存パッケージをインストール
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Chromiumをインストール
      run: pnpm --filter crawler exec playwright install --with-deps chromium
      shell: bash
