name: "クローラー環境のセットアップ"
description: "Node.js、依存パッケージ、Chromiumをセットアップする"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      with:
        version: 10

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ".node-version"
        cache: "pnpm"

    - name: 依存パッケージをインストール
      run: pnpm install --frozen-lockfile --filter crawler...
      shell: bash

    - name: システム依存パッケージのキャッシュキーを算出
      id: apt
      shell: bash
      run: |
        set -euo pipefail
        # playwright install --with-deps chromium が導入する対象(playwright 1.62 / ubuntu24.04-x64 の chromium + tools)
        packages=(
          xvfb
          fonts-freefont-ttf
          fonts-ipafont-gothic
          fonts-liberation
          fonts-noto-color-emoji
          fonts-tlwg-loma-otf
          fonts-unifont
          fonts-wqy-zenhei
          libfontconfig1
          libfreetype6
          xfonts-cyrillic
          xfonts-scalable
          libasound2t64
          libatk-bridge2.0-0t64
          libatk1.0-0t64
          libatspi2.0-0t64
          libcairo2
          libcups2t64
          libdbus-1-3
          libdrm2
          libgbm1
          libglib2.0-0t64
          libnspr4
          libnss3
          libpango-1.0-0
          libx11-6
          libxcb1
          libxcomposite1
          libxdamage1
          libxext6
          libxfixes3
          libxkbcommon0
          libxrandr2
        )
        # ランナーイメージが更新されるとプリインストール構成が変わり、キャッシュ済み .deb では不足しうるためイメージ版数もキーに含める
        image="$(printenv ImageVersion || echo unknown)"
        {
          printf 'packages=%s\n' "${packages[*]}"
          printf 'fingerprint=%s-%s\n' "${image}" "$(printf '%s' "${packages[*]}" | sha256sum | cut -c-12)"
        } >>"${GITHUB_OUTPUT}"

    - name: システム依存パッケージのキャッシュを復元
      id: apt-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.apt-debs
        key: apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.apt.outputs.fingerprint }}

    - name: 不足しているシステム依存パッケージを取得
      if: steps.apt-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        PACKAGES: ${{ steps.apt.outputs.packages }}
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        mkdir -p "${HOME}/.apt-debs"
        # 不足が無い場合もキャッシュを保存させ、次回以降の apt-get update を省くためマーカーを置く
        touch "${HOME}/.apt-debs/.keep"
        read -ra requested <<<"${PACKAGES}"
        # ランナーへ未導入のパッケージだけを解決して .deb を取得する
        simulated="$(apt-get install --simulate --no-install-recommends "${requested[@]}")"
        mapfile -t missing < <(printf '%s\n' "${simulated}" | awk '/^Inst / {print $2}')
        if [ "${#missing[@]}" -gt 0 ]; then
          (cd "${HOME}/.apt-debs" && apt-get download "${missing[@]}")
        fi

    - name: システム依存パッケージをインストール
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        debs=("${HOME}/.apt-debs"/*.deb)
        if [ "${#debs[@]}" -eq 0 ]; then
          echo "追加が必要なシステム依存パッケージはありません"
          exit 0
        fi
        sudo dpkg --install --skip-same-version "${debs[@]}"

    - name: Chromiumのキャッシュを復元
      id: chromium-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        # 取得するブラウザビルドは playwright のバージョンで決まるため、それを固定している package.json をキーにする
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/crawler/package.json') }}

    - name: Chromiumをインストール
      if: steps.chromium-cache.outputs.cache-hit != 'true'
      run: pnpm --filter crawler exec playwright install chromium
      shell: bash
