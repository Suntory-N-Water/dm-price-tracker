name: クローラーセットアップ検証

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Chromiumの起動を確認
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/crawler-setup
      - name: Chromiumを起動してスクリーンショットを撮る
        shell: bash
        run: |
          set -euo pipefail
          # ESM の解決はスクリプトの位置基準のため、crawler の node_modules を辿れる場所に置く
          cat >apps/crawler/launch-check.mjs <<'EOS'
          import { chromium } from 'playwright';

          const browser = await chromium.launch();
          const page = await browser.newPage();
          await page.setContent('<h1>デュエル・マスターズ 価格チェック</h1>');
          await page.screenshot({ path: `${process.env.RUNNER_TEMP}/launch-check.png` });
          console.log(`Chromium ${browser.version()} / ${await page.textContent('h1')}`);
          await browser.close();
          EOS
          pnpm --filter crawler exec node launch-check.mjs
          ls -l "${RUNNER_TEMP}/launch-check.png"
