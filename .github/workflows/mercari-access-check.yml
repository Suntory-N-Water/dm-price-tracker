name: メルカリ接続確認

on:
  issue_comment:
    types:
      - created

permissions: {}

concurrency:
  group: mercari-access-check
  cancel-in-progress: false

jobs:
  capture:
    name: 検索ページを撮影
    if: >-
      github.event.issue.pull_request == null &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      contains(github.event.comment.body, '@Suntory-N-Water mercari-check')
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    env:
      SCREENSHOT_PATH: /tmp/mercari-search.png
      TARGET_URL: https://jp.mercari.com/search?keyword=%E4%B8%96%E7%95%8C%E7%AB%9C%E7%9A%87%20%E3%83%9C%E3%83%AB%E3%82%B7%E3%83%A3%E3%83%83%E3%82%AF%E3%83%BB%E3%83%92%E3%82%AB%E3%83%AA%E3%82%B9%E3%83%9E&sort=created_time&order=desc&category_id=1290
    steps:
      - name: agent-browserをインストール
        run: npm install --global agent-browser@0.33.0

      - name: Chromeとシステム依存をインストール
        run: agent-browser install --with-deps

      - name: メルカリ検索ページを撮影
        id: capture
        run: |
          set -euo pipefail
          trap 'agent-browser --session mercari-check close || true' EXIT

          agent-browser --session mercari-check open "$TARGET_URL"
          agent-browser --session mercari-check wait --load domcontentloaded
          agent-browser --session mercari-check wait 3000
          agent-browser --session mercari-check eval \
            '({ userAgent: navigator.userAgent, language: navigator.language, languages: navigator.languages, timezone: Intl.DateTimeFormat().resolvedOptions().timeZone })'
          snapshot="$(
            agent-browser --session mercari-check snapshot -i
          )"
          printf '%s\n' "$snapshot"
          if [[ "$snapshot" == *'button "閉じる"'* ]]; then
            agent-browser --session mercari-check \
              find role button click --name "閉じる" --exact
          fi

          current_url="$(agent-browser --session mercari-check get url)"
          case "$current_url" in
            https://jp.mercari.com/*) ;;
            *)
              echo "想定外のURLへ遷移しました: $current_url"
              exit 1
              ;;
          esac

          # shellcheck disable=SC2016
          agent-browser --session mercari-check eval \
            'Array.from(document.querySelectorAll(`.merItemThumbnail[role="img"][aria-label]`)).map((thumbnail) => { const anchor = thumbnail.closest(`a[href^="/item/"]`); const thumbnailLabel = thumbnail.getAttribute("aria-label") ?? ""; const yenMatch = thumbnailLabel.match(/([0-9,]+)円(?:\s+US\$[0-9,.]+)?$/); const priceElement = thumbnail.querySelector(".merPrice"); const originalVisiblePrice = priceElement?.textContent?.trim() ?? ""; if (yenMatch !== null && priceElement !== null) { priceElement.textContent = `¥${yenMatch[1]}`; } return { url: anchor?.href ?? "", title: anchor?.querySelector(`[data-testid="thumbnail-item-name"]`)?.textContent?.trim() ?? "", originalVisiblePrice, thumbnailLabel, yenPrice: yenMatch === null ? null : Number(yenMatch[1].replaceAll(",", "")) }; })' \
            >/tmp/items.json
          jq . /tmp/items.json
          agent-browser --session mercari-check screenshot "$SCREENSHOT_PATH"

          item_count="$(jq 'length' /tmp/items.json)"
          if (( item_count == 0 )); then
            echo "検索結果の商品を取得できませんでした"
            exit 1
          fi
          yen_count="$(
            jq '[.[] | select(.yenPrice != null)] | length' /tmp/items.json
          )"
          first_visible_price="$(jq -r '.[0].originalVisiblePrice' /tmp/items.json)"
          first_yen_price="$(jq -r '.[0].yenPrice' /tmp/items.json)"

          {
            echo "item_count=${item_count}"
            echo "yen_count=${yen_count}"
            echo "first_visible_price=${first_visible_price}"
            echo "first_yen_price=${first_yen_price}"
            if (( yen_count == item_count )); then
              echo "all_items_have_yen=true"
            else
              echo "all_items_have_yen=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: スクリーンショットをIssueへ掲載
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST_VISIBLE_PRICE: ${{ steps.capture.outputs.first_visible_price }}
          FIRST_YEN_PRICE: ${{ steps.capture.outputs.first_yen_price }}
          ITEM_COUNT: ${{ steps.capture.outputs.item_count }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          YEN_COUNT: ${{ steps.capture.outputs.yen_count }}
        run: |
          set -euo pipefail

          artifact_branch="verification-artifacts"
          artifact_path="mercari/${GITHUB_RUN_ID}.png"

          if ! gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/${artifact_branch}" \
            >/dev/null 2>&1; then
            main_sha="$(
              gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
                --jq '.object.sha'
            )"
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/${artifact_branch}" \
              -f sha="$main_sha" \
              >/dev/null
          fi

          base64 --wrap=0 "$SCREENSHOT_PATH" |
            jq \
              --raw-input \
              --slurp \
              --arg message "chore: メルカリ接続確認の画像を保存" \
              --arg branch "$artifact_branch" \
              '{ message: $message, content: ., branch: $branch }' \
              >/tmp/upload.json
          gh api --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/${artifact_path}" \
            --input /tmp/upload.json \
            >/dev/null

          image_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${artifact_branch}/${artifact_path}"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "$(printf 'GitHub-hosted runnerの初期状態で検索結果を%s件取得し、%s件から日本円価格を取得できました（先頭: %s円、初期表示: %s）。スクリーンショットでは表示価格を日本円へ上書きしています。\n\n![メルカリ検索ページ](%s)\n\n[Workflow run](%s)' "$ITEM_COUNT" "$YEN_COUNT" "$FIRST_YEN_PRICE" "$FIRST_VISIBLE_PRICE" "$image_url" "$run_url")"

      - name: 日本円価格の取得結果を確認
        if: steps.capture.outputs.all_items_have_yen != 'true'
        run: |
          echo "一部商品から日本円価格を取得できませんでした"
          exit 1

      - name: 失敗をIssueへ通知
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "メルカリ接続確認に失敗しました。[Workflow run](${run_url})"
